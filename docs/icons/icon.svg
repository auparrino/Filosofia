<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Ágora: la lechuza de Atenea en figuras negras sobre terracota, con una greca debajo</title>
  <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
  <g clip-path="url(#r)">
  <defs>
    <radialGradient id="arcilla" cx=".5" cy=".38" r=".75"><stop offset="0" stop-color="#d0703f"/><stop offset="1" stop-color="#a8492a"/></radialGradient>
    <pattern id="greca" width="64" height="82" patternUnits="userSpaceOnUse" x="0" y="430">
      <path d="M0 70h60V14H16v40h32V30H30" fill="none" stroke="#c9692f" stroke-width="8" stroke-linecap="square"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#arcilla)"/>
  <!-- the owl, black figure: body, head with tufts, two big eyes, the beak -->
  <g id="lechuza">
  <path d="M256 128c-52 0-88 22-104 44l-14-40c-4 18-6 40-2 62-14 22-22 50-22 82 0 84 58 136 142 136s142-52 142-136c0-32-8-60-22-82 4-22 2-44-2-62l-14 40c-16-22-52-44-104-44z" fill="#1c1a17"/>
  <circle cx="204" cy="230" r="44" fill="#f4ede1"/>
  <circle cx="308" cy="230" r="44" fill="#f4ede1"/>
  <circle cx="208" cy="234" r="20" fill="#1c1a17"/>
  <circle cx="304" cy="234" r="20" fill="#1c1a17"/>
  <circle cx="214" cy="226" r="6" fill="#f4ede1"/>
  <circle cx="310" cy="226" r="6" fill="#f4ede1"/>
  <path d="M256 262l-16 22 16 26 16-26z" fill="#c9962b"/>
  <!-- the incised feathers of the breast, in clay color -->
  <path d="M216 336q20 16 40 0q20 16 40 0M196 366q20 16 40 0q20 16 40 0q20 16 40 0M216 396q20 16 40 0q20 16 40 0" fill="none" stroke="#b5532f" stroke-width="6" stroke-linecap="round"/>
  </g>
